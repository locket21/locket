<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Camera Pinch Zoom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    .camera-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #09090b;
      touch-action: none;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform 0.05s linear;
      pointer-events: none;
    }

    .hud-top {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(24, 24, 27, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      font-size: 14px;
      font-weight: 600;
    }

    .hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(24, 24, 27, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="camera-stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div class="hud-top">
    <div class="pill" id="zoomLabel">1.0x</div>
  </div>

  <div class="hint">Chụm hoặc mở 2 ngón tay để zoom</div>

  <script>
    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const zoomLabel = document.getElementById("zoomLabel");

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 5;

    let currentZoom = 1;
    let startZoom = 1;
    let startDistance = 0;
    let isPinching = false;

    let videoTrack = null;
    let zoomCapabilities = null;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        if (videoTrack && typeof videoTrack.getCapabilities === "function") {
          const caps = videoTrack.getCapabilities();
          if (caps.zoom) {
            zoomCapabilities = caps.zoom;
          }
        }
      } catch (err) {
        console.error("Không mở được camera:", err);
      }
    }

    function getDistance(touchA, touchB) {
      const dx = touchA.clientX - touchB.clientX;
      const dy = touchA.clientY - touchB.clientY;
      return Math.hypot(dx, dy);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    async function applyZoom(zoomValue) {
      const clamped = clamp(Number(zoomValue.toFixed(2)), MIN_ZOOM, MAX_ZOOM);
      currentZoom = clamped;
      zoomLabel.textContent = `${clamped.toFixed(1)}x`;

      if (videoTrack && zoomCapabilities && typeof videoTrack.applyConstraints === "function") {
        const hardwareZoom = clamp(
          clamped,
          zoomCapabilities.min ?? MIN_ZOOM,
          zoomCapabilities.max ?? MAX_ZOOM
        );

        try {
          await videoTrack.applyConstraints({
            advanced: [{ zoom: hardwareZoom }]
          });
          video.style.transform = "scale(1)";
          return;
        } catch (_) {
          // Fallback sang CSS scale nếu thiết bị không hỗ trợ zoom phần cứng qua web
        }
      }

      video.style.transform = `scale(${clamped})`;
    }

    stage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        startDistance = getDistance(e.touches[0], e.touches[1]);
        startZoom = currentZoom;
      }
    }, { passive: true });

    stage.addEventListener("touchmove", (e) => {
      if (!isPinching || e.touches.length < 2) return;
      e.preventDefault();

      const currentDistance = getDistance(e.touches[0], e.touches[1]);
      if (startDistance <= 0) return;

      const scaleFactor = currentDistance / startDistance;
      applyZoom(startZoom * scaleFactor);
    }, { passive: false });

    function handleTouchEnd(e) {
      if (e.touches.length < 2) {
        isPinching = false;
        startDistance = 0;
      }
    }

    stage.addEventListener("touchend", handleTouchEnd, { passive: true });
    stage.addEventListener("touchcancel", handleTouchEnd, { passive: true });

    initCamera();
  </script>
</body>
</html>
